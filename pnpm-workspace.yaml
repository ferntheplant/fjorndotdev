packages:
  - apps/*
  - packages/*
  - tools/*

# `prefer` makes `vp add` reach for a catalog entry when one exists, so a second
# package cannot silently land on a different version of a shared dependency.
catalogMode: prefer

# `vp add` writes the exact version it resolved, never a `^` range; tools/workspace-conventions
# holds every version here to that, and says why.
savePrefix: ""

# One version of every shared dependency, named once; packages depend on `catalog:`.
# .forgejo/workflows/dependency-bumps.yml opens a weekly PR bumping these to their newest
# minor and patch versions, except the ones `updateConfig` below holds back.
catalog:
  "@alchemy.run/frontend-frameworks": 2.0.0-beta.81
  "@astrojs/check": 0.9.10
  "@astrojs/markdown-remark": 7.3.1
  "@astrojs/mdx": 8.0.2
  "@astrojs/react": 7.0.0
  "@commitlint/cli": 21.2.3
  "@commitlint/config-conventional": 21.2.3
  "@effect/platform-node": 4.0.3
  "@effect/tsgo": 0.51.1
  "@effect/vitest": 4.0.3
  "@lucide/astro": 0.542.0
  "@radix-ui/react-slot": 1.2.3
  "@shadcn/lint": 0.2.3
  "@tailwindcss/vite": 4.1.12
  "@types/hast": 3.0.5
  "@types/node": 24.19.1
  "@types/react": 19.1.12
  "@types/react-dom": 19.1.9
  alchemy: 2.0.0-beta.81
  astro: 7.3.7
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  effect: 4.0.3
  fallow: 3.31.0
  katex: 0.16.22
  react: 19.1.1
  react-dom: 19.1.1
  rehype-autolink-headings: 7.1.0
  rehype-katex: 7.0.1
  rehype-slug: 6.0.0
  rehype-stringify: 10.0.1
  remark-gfm: 4.0.1
  remark-math: 6.0.0
  remark-parse: 11.0.0
  remark-rehype: 11.1.2
  remark-toc: 9.0.0
  sherif: 1.13.0
  tailwind-merge: 3.3.1
  tailwindcss: 4.1.12
  taze: 21.3.0
  tw-animate-css: 1.3.7
  typescript: 7.0.2
  ultracite: 8.0.0
  unified: 11.0.5
  unist-util-visit-parents: 6.0.1
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  yaml: 2.9.1

# TypeScript for tools/astro-check only. `astro check` type-checks `.astro` files through Volar,
# which loads TypeScript's JavaScript API, and TypeScript 7 has none: @astrojs/check and every
# @volar package require a version below 7. tools/astro-check's package.json says why the check
# lives in its own package. Bump this by hand until @astrojs/check supports TypeScript 7.
catalogs:
  astro-check:
    typescript: 6.0.3

# Dependencies allowed to run install scripts; pnpm skips every other one. Each one checks for or
# fetches its platform binary: Tailwind's oxide engine, esbuild for Vite and Astro, and workerd,
# which `preview:cf` (`alchemy dev`) runs the site in.
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  workerd: true

# Upgraded by hand, together, never by the weekly bump: each of these is tied to the Oxlint that
# vite-plus bundles. Both `pnpm update` and taze skip them.
updateConfig:
  ignoreDependencies:
    # Vite+ and the Vite core it ships under the `vite` alias move as one release.
    - vite
    - vite-plus
    # Each release supports a fixed list of Oxlint versions and patches the one vite-plus
    # bundles (BASELINE.md, _Effect_).
    - "@effect/tsgo"
    # Its presets name every rule and fail to load on a bundled Oxlint that lacks one
    # (BASELINE.md, _Lint presets_).
    - ultracite
    # alchemy 2.0.0-beta.81 imports `effect/Crypto`, which Effect 4.1 removed, so Effect stays on
    # 4.0 until alchemy moves too (2.0.0-beta.85 requires Effect ^4.1). Upgrade them together, with
    # the two Effect overrides below, and run apps/site/alchemy.run.test.ts.
    - effect
    - "@effect/platform-node"
    - "@effect/vitest"
    - alchemy
    - "@alchemy.run/frontend-frameworks"

# Vite+ ships its own Vite core under an alias; the override keeps every
# transitive `vite` on that same build rather than the public package.
overrides:
  vite@*: "catalog:"
  # @astrojs/check's language server loads a WASM runtime whose `@emnapi/*` peer range admits 2.x
  # prereleases, and pnpm resolves it to the 2.0.0 beta that rolldown also pulls in. That beta
  # crashes on load (`this.bridge.setLastError is not a function`), so `astro check` cannot start.
  # Hold every copy on the 1.x line until a stable 2.x ships.
  "@emnapi/core": 1.11.3
  "@emnapi/runtime": 1.11.3
  # Every Effect package must be on one version: a 4.1 package fails to load on a 4.0 `effect`
  # (tools/ready-agent crashed), and alchemy 2.0.0-beta.81 imports `effect/Crypto`, which 4.1
  # removed. These two come in through alchemy and @effect/platform-node with `^4.0.0` ranges, so
  # they would otherwise resolve to the newest 4.x. Move them with the catalog's `effect`.
  "@effect/platform-node-shared": 4.0.3
  "@effect/sql-sqlite-do": 4.0.3

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
